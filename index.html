<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Srpske reči</title>
<meta name="theme-color" content="#faf5e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reči">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#faf5e8; --bg-soft:#fffdf5; --fg:#2a2317; --fg-dim:#6f6450; --line:#e9dfc6; --line-strong:#c9bc9c;
  --accent:#bf4426; --accent-soft:#f6e3d3; --track:#f3ead5; --on-accent:#fff; --ink:#2a2317; --on-ink:#faf5e8;
  --scrim:rgba(42,35,23,.45);
  --radius:16px;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14151a; --bg-soft:#1b1d24; --fg:#e9e7e2; --fg-dim:#9a9da8; --line:#2b2e38; --line-strong:#4a4e5c;
    --accent:#ff6b5a; --accent-soft:#3a2320; --track:#232630; --on-accent:#1b0d0a; --ink:#e9e7e2; --on-ink:#14151a;
    --scrim:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{height:100%;overflow:hidden;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-text-size-adjust:100%}
/* The page itself never scrolls: the screen scrolls inside, and the tab bar is a plain row under it. */
body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.serif{font-family:var(--serif)}
.dim{color:var(--fg-dim)}
.small{font-size:13px}
.panel{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.grow{flex:1 1 auto}
.btn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg-soft);font-size:16px;padding:0 16px}
.btn.primary{background:var(--accent);color:var(--on-accent);border:0;font-weight:600;font-size:17px;min-height:56px}
.btn.ink{background:var(--ink);color:var(--on-ink);border:0;font-weight:600;font-size:17px;min-height:56px}
.btn:active{transform:scale(.985)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--fg-dim);flex:none}
.icon-btn.boxed{border:1px solid var(--line);background:var(--bg-soft)}
.icon-btn svg{width:22px;height:22px}
.top{display:flex;align-items:center;gap:8px;min-height:44px}
.title{font-family:var(--serif);font-size:24px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bar{height:8px;background:var(--track);border-radius:4px;display:flex;overflow:hidden}
.bar>span{display:block;height:100%}

/* Home */
.cells{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.cells span{height:10px;border-radius:2px;background:var(--line)}
.cells span.learning{background:var(--accent)}
.cells span.learned{background:var(--ink)}
.big{font-size:22px;font-weight:600}
.group-name{font-family:var(--serif);font-size:34px}

/* Study */
.progress{flex:1 1 auto;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);transition:width .2s}
.card{flex:1 1 auto;background:var(--bg-soft);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;min-height:360px}
.card.front{align-items:center;justify-content:center;text-align:center;border:1px solid var(--line)}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px}
.tag.plain{color:var(--fg-dim);background:var(--track)}
.q{font-family:var(--serif);font-size:44px;line-height:1.15;overflow-wrap:anywhere}
.q.long{font-size:30px}
.a-head{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.a-sr{font-family:var(--serif);font-size:34px;line-height:1.15;overflow-wrap:anywhere}
.a-ru{font-size:21px;font-weight:600}
.sep{height:1px;background:var(--line)}
.ex{display:flex;flex-direction:column;gap:2px}
.ex .s{font-family:var(--serif);font-size:17px;font-style:italic}
.ex .t{font-size:15px;color:var(--fg-dim)}
.note{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.45;white-space:pre-line}
.speak{width:48px;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--bg);color:var(--fg-dim);display:flex;align-items:center;justify-content:center}
.speak svg{width:20px;height:20px}
/* Screens scroll as a whole; only the study card may shrink to fit. */
.view>*{flex-shrink:0}
#study{overflow:hidden;position:relative}
#study .card{flex-shrink:1;min-height:0;touch-action:pan-y;transition:transform .16s ease-out;-webkit-user-select:none;user-select:none}
#study .card.dragging{transition:none}
#s-back,#s-front{overflow-y:auto;overscroll-behavior:contain}
.front-ex{display:flex;flex-direction:column;gap:10px;margin-top:6px;max-width:100%}
.front-ex div{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.35}
.pill{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--bg-soft);font-size:14px;color:var(--fg-dim);flex:none}
#s-close{width:48px;height:48px;color:var(--fg)}
#s-close svg{width:26px;height:26px}
#s-front{position:relative}
.card-pill{position:absolute;top:14px;right:14px}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);font-weight:600}
.stamp{position:absolute;top:calc(env(safe-area-inset-top) + 96px);left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:12px;font-weight:600;font-size:18px;opacity:0;pointer-events:none;z-index:2}
.stamp.know{background:var(--ink);color:var(--on-ink)}
.stamp.again{background:var(--accent);color:var(--on-accent)}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rate button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--bg-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 4px}
.rate b{font-size:15px}
.rate small{font-size:12px;color:var(--fg-dim)}
.rate .again{background:var(--accent);color:var(--on-accent);border:0}
.rate .again small,.rate .know small{color:inherit;opacity:.85}
.rate .know{background:var(--ink);color:var(--on-ink);border:0}

/* Lists */
.list{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.list>button{display:flex;align-items:center;gap:12px;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.list>button:last-child{border-bottom:0}
.num{font-size:12px;color:var(--fg-dim);width:34px;flex:none}
.two{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto}
.two .s{font-family:var(--serif);font-size:17px}
.two .t{font-size:14px;color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:5px;flex:none;border:1.5px solid var(--line-strong)}
.dot.learning{background:var(--accent);border:0}
.dot.learned{background:var(--ink);border:0}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;color:var(--fg-dim)}
.search input{border:0;background:transparent;font-size:16px;flex:1 1 auto;outline:none;color:var(--fg);min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--bg-soft);font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

.groups{display:flex;flex-direction:column;gap:8px}
.g{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg-soft);text-align:left;width:100%}
.g .row{width:100%}
.g.ahead{background:transparent;border-style:dashed;border-color:var(--line-strong)}
.g.current{border:2px solid var(--accent)}
.badge{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;border:1.5px solid var(--line-strong);color:var(--fg-dim)}
.badge.done{background:var(--ink);color:var(--on-ink);border:0}
.badge.cur{background:var(--accent-soft);color:var(--accent);border:0;font-weight:600}
.badge svg{width:16px;height:16px}

.cat{flex-direction:row}
.list>button.cat{padding:16px;gap:14px}
.cat-body{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-width:0}
.cat-body b{font-size:17px}
.chev{width:18px;height:18px;color:var(--fg-dim);flex:none}
.bar>span{transition:width .2s}
.block-title{font-size:13px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.06em;padding:8px 4px 0}
.words{font-family:var(--serif);font-size:15px;line-height:1.7;color:var(--fg-dim)}
.words .learned{color:var(--fg)}
.words .learning{color:var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--fg-dim)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:4px;display:block}

/* Tab bar */
.view.tabbed{padding-bottom:24px}
.tabbar{flex:none;touch-action:none;background:var(--bg-soft);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabbar>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabbar button{min-height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--fg-dim)}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}

/* Settings */
.set{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column}
.set>*{padding:14px 16px;border-bottom:1px solid var(--line)}
.set>*:last-child{border-bottom:0}
.set .link{border-left:0;border-right:0;border-top:0;background:transparent;text-align:left;color:var(--accent);font-size:16px;min-height:52px;width:100%}
.set .link:last-child{border-bottom:0}
.section{font-size:13px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.06em;padding:4px 4px 0}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px}
.stepper span{min-width:28px;text-align:center;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--track);border-radius:10px;padding:3px}
.seg button{min-height:38px;border:0;border-radius:8px;background:transparent;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--bg-soft);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.switch{width:52px;height:32px;border-radius:16px;border:0;background:var(--line-strong);padding:3px;display:flex;flex:none}
.switch span{width:26px;height:26px;border-radius:13px;background:var(--bg-soft);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"] span{transform:translateX(20px)}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:24px 24px 0 0;padding:12px 20px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:16px}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet h2{font-family:var(--serif);font-weight:normal;font-size:26px;margin:0}
.sheet p{margin:0;font-size:16px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:12px;font-size:15px;z-index:20;max-width:90vw}
</style>
</head>
<body>

<!-- Home -->
<section id="home" class="view tabbed">
  <div class="serif" style="font-size:28px">Srpske reči</div>

  <div class="panel">
    <div class="dim small" id="h-crumb"></div>
    <div class="between">
      <span style="display:flex;flex-direction:column;gap:2px"><span class="group-name" id="h-name"></span><span class="dim" style="font-size:14px" id="h-sub"></span></span>
      <span class="big" id="h-count"></span>
    </div>
    <div class="cells" id="h-cells"></div>
    <div class="dim" style="font-size:14px;line-height:1.4" id="h-hint"></div>
    <button class="btn primary" id="h-start"></button>
  </div>

  <button class="panel" id="h-review" style="text-align:left;flex-direction:row;align-items:center;justify-content:space-between">
    <span style="display:flex;flex-direction:column;gap:4px"><span style="font-size:16px">Повторить старые</span><span class="dim small">пора вспомнить</span></span>
    <span class="big" id="h-review-n"></span>
  </button>

  <div class="grow"></div>
  <div class="dim small" style="text-align:center" id="h-foot"></div>
</section>

<!-- Catalog -->
<section id="catalog" class="view tabbed" hidden>
  <div class="serif" style="font-size:28px">Каталог</div>
  <div class="list">
    <button data-go="groups" class="cat"><span class="cat-body"><span class="between"><b>Частотный словарь</b><span class="dim small" id="c-f-count"></span></span><span class="dim small" id="c-f-sub"></span><span class="bar" style="height:6px"><span id="c-f-bar" style="background:var(--ink)"></span></span></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    <button data-go="themes" class="cat"><span class="cat-body"><span class="between"><b>По темам</b><span class="dim small" id="c-t-count"></span></span><span class="dim small" id="c-t-sub"></span><span class="bar" style="height:6px"><span id="c-t-bar" style="background:var(--ink)"></span></span></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <div class="dim" style="font-size:14px;line-height:1.45;padding:0 4px">Слово, выученное в одном разделе, засчитывается и в другом.</div>
</section>

<!-- Study -->
<section id="study" class="view" hidden>
  <div class="top">
    <button class="icon-btn boxed" id="s-close" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="progress"><span id="s-bar"></span></div>
    <div class="dim small" id="s-count" style="min-width:56px;text-align:right"></div>
  </div>
  <div class="card front" id="s-front" role="button" tabindex="0" aria-label="Показать ответ">
    <button class="pill card-pill" id="s-ex" aria-pressed="false">Примеры</button>
    <span class="tag" id="s-tag"></span>
    <div class="q" id="s-q"></div>
    <div class="dim" style="font-size:15px" id="s-meta"></div>
    <button class="speak" id="s-speak1" aria-label="Произнести"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
    <div class="front-ex" id="s-ex-list" hidden></div>
  </div>
  <div class="card" id="s-back" hidden></div>
  <button class="btn ink" id="s-show">Показать ответ</button>
  <div class="rate" id="s-rate" hidden>
    <button class="again" data-r="0"><b>Повторить</b><small></small></button>
    <button class="know" data-r="2"><b>Знаю</b><small></small></button>
    <button data-r="4"><b>Изучено</b><small></small></button>
  </div>
  <div class="dim small" style="text-align:center">← повторить · свайп · знаю →</div>
  <div class="stamp" id="s-stamp" aria-hidden="true"></div>
</section>

<!-- Done -->
<section id="done" class="view" hidden>
  <div style="height:8vh"></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
    <div class="serif" style="font-size:40px" id="d-title"></div>
    <div class="dim" style="font-size:17px" id="d-sub"></div>
  </div>
  <div class="panel" id="d-group"></div>
  <div class="panel" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px" id="d-stats"></div>
  <div class="panel" id="d-missed" hidden></div>
  <div class="grow"></div>
  <button class="btn primary" id="d-main"></button>
  <button class="btn" id="d-home">На главную</button>
</section>

<!-- Groups -->
<section id="groups" class="view tabbed" hidden>
  <div class="top">
    <button class="icon-btn" data-go="catalog" aria-label="Назад" style="color:var(--fg)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div style="display:flex;flex-direction:column"><span class="dim small">Каталог</span><span class="title">Частотный словарь</span></div><div class="grow"></div><div class="dim" style="font-size:14px" id="g-total"></div>
  </div>
  <div class="groups" id="g-list"></div>
</section>

<!-- Themes -->
<section id="themes" class="view tabbed" hidden>
  <div class="top">
    <button class="icon-btn" data-go="catalog" aria-label="Назад" style="color:var(--fg)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div style="display:flex;flex-direction:column"><span class="dim small">Каталог</span><span class="title">По темам</span></div><div class="grow"></div><div class="dim" style="font-size:14px" id="t-total"></div>
  </div>
  <div class="groups" id="t-list"></div>
</section>

<!-- Theme -->
<section id="theme" class="view tabbed" hidden>
  <div class="top">
    <button class="icon-btn" data-go="themes" aria-label="Назад" style="color:var(--fg)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div style="display:flex;flex-direction:column"><span class="title" id="th-title"></span><span class="dim small" id="th-sub"></span></div>
  </div>
  <div class="groups" id="th-list"></div>
</section>

<!-- Dictionary -->
<section id="dict" class="view tabbed" hidden>
  <div class="top">
    
    <div class="title">Словарь</div>
  </div>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Поиск по-сербски или по-русски" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Поиск">
  </label>
  <div class="chips" id="chips"></div>
  <div class="list" id="d-list"></div>
  <button class="btn" id="d-more" hidden>Показать ещё</button>
</section>

<!-- Word -->
<section id="word" class="view tabbed" hidden>
  <div class="top">
    <button class="icon-btn" id="w-back" aria-label="Назад" style="color:var(--fg)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="title" id="w-title"></div>
  </div>
  <div class="card" id="w-card"></div>
  <div class="panel" id="w-status"></div>
</section>

<!-- Settings -->

<script src="words.js"></script>
<script>
"use strict";
const W = window.WORDS;
const T = window.THEMES;
const N = W.length;
const FREQ = 3428;
const GROUP = 20;
const GROUPS = Math.ceil(FREQ / GROUP);
const KEY = "srpske-reci-v1";
const MIN = 60e3, DAY = 864e5;
const $ = (id) => document.getElementById(id);

/* ---------- Storage ---------- */

// pos keeps the current group of each course ("f" frequency, "t" themes); last is the course to continue.
function blank() {
  return { v: 1, cards: {}, pos: { f: "f:0", t: "t:0:0" }, last: "f", set: { need: 2, dir: "sr", speak: false, ex: false }, days: {} };
}

function upgrade(p) {
  const b = blank();
  const q = { ...b, ...p, set: { ...b.set, ...p.set } };
  if (!p.pos) q.pos = { f: "f:" + (p.cur || 0), t: "t:0:0" };
  delete q.cur;
  return q;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      return upgrade(JSON.parse(raw));
    }
  } catch (e) {}
  return blank();
}

let P = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(P)); }
  catch (e) { toast("Не получилось сохранить прогресс"); }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- Dates: a study day starts at 04:00 local time ---------- */

function dayKey(ts) {
  const d = new Date(ts - 4 * 3600e3);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dayStart(ts, plusDays) {
  const d = new Date(ts - 4 * 3600e3);
  d.setHours(4, 0, 0, 0);
  d.setDate(d.getDate() + plusDays);
  return d.getTime();
}

/* ---------- Words and progress ---------- */

// Group keys: "f:<g>" is frequency group g; "t:<i>:<g>" is group g of theme i.
// A theme is cut into equal groups of at most GROUP words (49 -> 17 + 16 + 16).
const THEME_GROUPS = T.map(([, , , words]) => {
  const k = Math.ceil(words.length / GROUP), out = [];
  let at = 0;
  for (let g = 0; g < k; g++) {
    const size = Math.floor(words.length / k) + (g < words.length % k ? 1 : 0);
    out.push(words.slice(at, at + size));
    at += size;
  }
  return out;
});
const KEYS = {
  f: Array.from({ length: GROUPS }, (_, g) => "f:" + g),
  t: THEME_GROUPS.flatMap((gs, i) => gs.map((_, g) => "t:" + i + ":" + g)),
};
const THEMES_OF = {};
T.forEach(([, , , words], i) => words.forEach((n) => (THEMES_OF[n] = THEMES_OF[n] || []).push(i)));

const parseKey = (key) => key.split(":").map((x, i) => (i ? +x : x));
const courseOf = (key) => key[0];
function groupWords(key) {
  const [c, a, b] = parseKey(key);
  if (c === "t") return THEME_GROUPS[a][b];
  const out = [];
  for (let n = a * GROUP + 1; n <= Math.min(FREQ, (a + 1) * GROUP); n++) out.push(n);
  return out;
}
function groupInfo(key) {
  const [c, a, b] = parseKey(key);
  if (c === "t") return { name: T[a][1], sub: "группа " + (b + 1) + " из " + THEME_GROUPS[a].length, crumb: "По темам › " + T[a][2], short: T[a][1] + " · группа " + (b + 1) };
  const w = groupWords(key);
  return { name: "Группа " + (a + 1), sub: "слова " + w[0] + "–" + w[w.length - 1], crumb: "Частотный словарь", short: "группа " + (a + 1) };
}
const card = (n) => P.cards[n];
const isLearned = (n) => { const c = card(n); return !!c && (c.k || c.d.length >= P.set.need); };
const isLearning = (n) => !!card(n) && !isLearned(n);
const isDue = (n, now) => { const c = card(n); return !c || c.due <= now; };
const groupLearnedCount = (key) => groupWords(key).filter(isLearned).length;
const groupDone = (key) => groupWords(key).every(isLearned);
const themeDone = (i) => THEME_GROUPS[i].every((_, g) => groupDone("t:" + i + ":" + g));
const curKey = () => P.pos[P.last];
const isAhead = (key, than) => KEYS[courseOf(key)].indexOf(key) > KEYS[courseOf(key)].indexOf(than);
const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);

function nextOpenGroup(key) {
  const list = KEYS[courseOf(key)], at = list.indexOf(key);
  for (let i = at + 1; i < list.length; i++) if (!groupDone(list[i])) return list[i];
  for (let i = 0; i < at; i++) if (!groupDone(list[i])) return list[i];
  return key;
}

function reviewDue(now) {
  const skip = new Set(groupWords(curKey()));
  const out = [];
  for (const k in P.cards) {
    const n = +k;
    if (!skip.has(n) && P.cards[k].due <= now) out.push(n);
  }
  return out.sort((a, b) => P.cards[a].due - P.cards[b].due);
}

/* ---------- Scheduling ---------- */

// Returns the card after rating r (0 again, 1 hard, 2 good, 3 easy, 4 mark as learned) and the delay label.
function schedule(c, r, now) {
  c = c ? { ...c, d: [...c.d] } : { i: 0, e: 2.5, due: now, l: 0, d: [] };
  const today = dayKey(now);
  const recalled = () => { if (!c.d.includes(today)) c.d.push(today); };
  if (r === 4) {
    c.k = true; c.i = Math.max(c.i, 30); recalled();
    c.due = dayStart(now, c.i);
    return { c, mins: 0, label: daysLabel(c.i) };
  }
  let mins = 0;
  if (c.i === 0) {
    if (r === 0) mins = 1;
    else if (r === 1) mins = 6;
    else if (r === 2) { c.i = 1; recalled(); }
    else { c.i = 4; c.e += 0.15; recalled(); }
  } else {
    if (r === 0) { c.l++; c.i = 0; c.e = Math.max(1.3, c.e - 0.2); mins = 1; }
    else if (r === 1) { c.i = Math.max(1, Math.round(c.i * 1.2)); c.e = Math.max(1.3, c.e - 0.15); recalled(); }
    else if (r === 2) { c.i = Math.max(c.i + 1, Math.round(c.i * c.e)); recalled(); }
    else { c.i = Math.max(Math.round(c.i * c.e) + 1, Math.round(c.i * c.e * 1.3)); c.e += 0.15; recalled(); }
  }
  c.due = mins ? now + mins * MIN : dayStart(now, c.i);
  return { c, mins, label: mins ? mins + " мин" : daysLabel(c.i) };
}

function daysLabel(d) {
  if (d < 30) return d + " д";
  if (d < 365) return Math.round(d / 30) + " мес";
  return (d / 365).toFixed(1).replace(".0", "") + " г";
}

/* ---------- Navigation ---------- */

const VIEWS = ["home", "catalog", "study", "done", "groups", "themes", "theme", "dict", "word", "settings"];
const TAB_OF = { home: "home", catalog: "catalog", groups: "catalog", themes: "catalog", theme: "catalog", dict: "dict", word: "dict", settings: "settings" };

// Shows the tab bar on tabbed screens and marks the tab the screen belongs to.
function syncTabs(v) {
  const tab = TAB_OF[v];
  $("tabbar").hidden = !tab;
  $("tabbar").querySelectorAll("[data-tab]").forEach((b) => {
    if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}
let view = "home";
function go(v) {
  view = v;
  if (typeof reloadPending !== "undefined" && reloadPending && v !== "study") { location.reload(); return; }
  for (const id of VIEWS) $(id).hidden = id !== v;
  syncTabs(v);
  $(v).scrollTop = 0;
  if (v === "home") renderHome();
  if (v === "catalog") renderCatalog();
  if (v === "groups") renderGroups();
  if (v === "themes") renderThemes();
  if (v === "theme") renderTheme();
  if (v === "dict") renderDict(true);
  if (v === "settings") renderSettings();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go]");
  if (t) go(t.dataset.go);
});

/* ---------- Home ---------- */

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function renderHome() {
  const now = Date.now();
  const key = curKey(), words = groupWords(key), info = groupInfo(key);
  const learned = groupLearnedCount(key);
  $("h-crumb").textContent = "Продолжить · " + info.crumb;
  $("h-name").textContent = info.name;
  $("h-sub").textContent = info.sub;
  $("h-count").innerHTML = '<span style="color:var(--accent)">' + learned + "</span> / " + words.length;
  $("h-cells").style.gridTemplateColumns = "repeat(" + words.length + ",minmax(0,1fr))";
  $("h-cells").innerHTML = words.map((n) => '<span class="' + (isLearned(n) ? "learned" : isLearning(n) ? "learning" : "") + '"></span>').join("");

  const due = words.filter((n) => !isLearned(n) && isDue(n, now)).length;
  const left = words.length - learned;
  const start = $("h-start");
  if (groupDone(key)) {
    const next = nextOpenGroup(key);
    $("h-hint").textContent = "Группа выучена.";
    start.textContent = next !== key ? "Дальше: " + groupInfo(next).short : "Всё выучено";
    start.dataset.act = "next";
  } else if (due > 0) {
    $("h-hint").textContent = "Осталось " + left + " " + plural(left, "слово", "слова", "слов") + " — и откроется следующая группа.";
    start.textContent = "Продолжить";
    start.dataset.act = "study";
  } else {
    $("h-hint").textContent = "На сегодня всё: остальные слова вернутся завтра. Можно прогнать группу ещё раз — это не повлияет на расписание.";
    start.textContent = "Прогнать ещё раз";
    start.dataset.act = "practice";
  }

  const rev = reviewDue(now).length;
  $("h-review").hidden = rev === 0;
  $("h-review-n").textContent = rev;

  const learnedWords = Object.keys(P.cards).filter((k) => isLearned(+k)).length;
  const streak = streakDays();
  $("h-foot").textContent = "Выучено " + learnedWords + " из " + N + " слов" + (streak > 1 ? " · серия " + streak + " " + plural(streak, "день", "дня", "дней") : "");
}

function renderCatalog() {
  const fDone = KEYS.f.filter(groupDone).length;
  $("c-f-count").textContent = fDone + " / " + GROUPS + " групп";
  $("c-f-sub").textContent = FREQ + " слов · по " + GROUP + " в группе · сейчас " + groupInfo(P.pos.f).short;
  $("c-f-bar").style.width = (fDone / GROUPS * 100) + "%";
  const tDone = T.filter((_, i) => themeDone(i)).length;
  $("c-t-count").textContent = tDone + " / " + T.length + " тем";
  $("c-t-sub").textContent = new Set(T.map((t) => t[2])).size + " блоков · " + (N - FREQ) + " новых слов · сейчас «" + T[parseKey(P.pos.t)[1]][1] + "»";
  $("c-t-bar").style.width = (tDone / T.length * 100) + "%";
}

$("h-start").addEventListener("click", () => {
  const act = $("h-start").dataset.act, key = curKey();
  if (act === "next") { const next = nextOpenGroup(key); if (next !== key) { P.pos[courseOf(key)] = next; save(); renderHome(); } }
  else startSession(act === "practice" ? "practice" : "group");
});
$("h-review").addEventListener("click", () => startSession("review"));

function streakDays() {
  let s = 0, t = Date.now();
  if (!P.days[dayKey(t)]) t -= DAY;
  while (P.days[dayKey(t)]) { s++; t -= DAY; }
  return s;
}

/* ---------- Study session ---------- */

let S = null;

function startSession(kind) {
  const now = Date.now();
  let queue;
  if (kind === "review") queue = reviewDue(now);
  else if (kind === "practice") queue = shuffle(groupWords(curKey()).filter((n) => !isLearned(n)));
  else {
    const words = groupWords(curKey()).filter((n) => !isLearned(n) && isDue(n, now));
    queue = [...words.filter((n) => card(n)), ...words.filter((n) => !card(n))];
  }
  if (!queue.length && kind === "practice") queue = shuffle(groupWords(curKey()));
  if (!queue.length) { go("home"); return; }
  S = { kind, g: curKey(), queue, done: 0, start: now, again: {}, fresh: new Set(), shown: false, dirs: {} };
  go("study");
  showCard();
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

// The Russian side lists Serbian forms in brackets; hide them when it is the question.
function ruQuestion(ru) {
  return ru.replace(/\s*\([^)]*\p{Script=Latin}[^)]*\)/gu, "").trim() || ru;
}

function dirFor(n) {
  if (P.set.dir !== "both") return P.set.dir;
  if (!S.dirs[n]) S.dirs[n] = Math.random() < 0.5 ? "sr" : "ru";
  return S.dirs[n];
}

function showCard() {
  const n = S.queue[0];
  const [sr, ru, pos] = W[n - 1];
  const dir = dirFor(n);
  S.shown = false;
  const total = S.done + S.queue.length;
  $("s-bar").style.width = (S.done / total * 100) + "%";
  $("s-count").textContent = (S.done + 1) + " / " + total;

  const c = card(n), tag = $("s-tag");
  tag.className = "tag";
  if (S.kind === "practice") { tag.textContent = "прогон"; tag.className = "tag plain"; }
  else if (!c) tag.textContent = "новое";
  else if (c.i === 0) tag.textContent = "снова";
  else { tag.textContent = "повтор"; tag.className = "tag plain"; }

  const q = dir === "sr" ? sr : ruQuestion(ru);
  $("s-q").textContent = q;
  $("s-q").classList.toggle("long", q.length > 14);
  $("s-meta").textContent = pos + " · №" + n;
  $("s-speak1").hidden = dir !== "sr" || !canSpeak();
  renderFrontEx();
  $("s-front").hidden = false;
  $("s-front").scrollTop = 0;
  $("s-back").hidden = true;
  $("s-show").hidden = false;
  $("s-rate").hidden = true;
  if (dir === "sr" && P.set.speak) speak(sr);
}

// Examples on the question side, in the question's language.
function renderFrontEx() {
  $("s-ex").setAttribute("aria-pressed", P.set.ex);
  const list = $("s-ex-list");
  list.hidden = !P.set.ex;
  if (!S || !P.set.ex) return;
  const n = S.queue[0], col = dirFor(n) === "sr" ? 0 : 1;
  list.innerHTML = W[n - 1][4].map((e) => "<div>" + esc(e[col]) + "</div>").join("");
}

function backHtml(n, withSpeak) {
  const [sr, ru, pos, forms, ex, note] = W[n - 1];
  return '<div class="a-head">' +
      '<div class="a-sr">' + esc(sr) + "</div>" +
      '<div class="a-ru">' + esc(ru) + "</div>" +
      '<div class="dim" style="font-size:14px">' + esc(pos) + (forms ? " · формы: " + esc(forms) : "") + "</div>" +
      (withSpeak && canSpeak() ? '<button class="speak" data-say="' + n + '" aria-label="Произнести" style="margin-top:6px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>' : "") +
    "</div>" +
    '<div class="sep"></div>' +
    ex.map(([s, t]) => '<div class="ex"><div class="s">' + esc(s) + '</div><div class="t">' + esc(t) + "</div></div>").join("") +
    (note ? '<div class="note">' + esc(note) + "</div>" : "");
}

function reveal() {
  if (!S || S.shown) return;
  S.shown = true;
  const n = S.queue[0];
  $("s-back").innerHTML = backHtml(n, true);
  $("s-front").hidden = true;
  $("s-back").hidden = false;
  $("s-show").hidden = true;
  $("s-rate").hidden = false;
  const now = Date.now();
  $("s-rate").querySelectorAll("button").forEach((b) => {
    const r = +b.dataset.r;
    b.querySelector("small").textContent = S.kind === "practice" && r !== 4 ? (r === 0 ? "ещё раз" : "дальше") : schedule(card(n), r, now).label;
  });
  if (dirFor(n) === "ru" && P.set.speak) speak(W[n - 1][0]);
}

function rate(r) {
  if (!S || !S.shown) return;
  const n = S.queue.shift();
  const now = Date.now();
  if (r === 0) S.again[n] = (S.again[n] || 0) + 1;
  let requeue = r === 0 ? 3 : 0;
  if (S.kind !== "practice" || r === 4) {
    if (!card(n)) S.fresh.add(n);
    const res = schedule(card(n), r, now);
    P.cards[n] = res.c;
    if (res.mins) requeue = res.mins === 1 ? 3 : 6;
    P.days[dayKey(now)] = (P.days[dayKey(now)] || 0) + 1;
    save();
  }
  if (requeue) S.queue.splice(Math.min(requeue, S.queue.length), 0, n);
  else S.done++;
  if (S.queue.length) showCard(); else finish();
}

$("s-front").addEventListener("click", (e) => { if (!swiped && !e.target.closest(".speak, .pill")) reveal(); });
$("s-show").addEventListener("click", reveal);
$("s-ex").addEventListener("click", () => { P.set.ex = !P.set.ex; save(); renderFrontEx(); });
$("s-rate").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) rate(+b.dataset.r); });
$("s-speak1").addEventListener("click", () => speak(W[S.queue[0] - 1][0]));
$("s-close").addEventListener("click", () => { S = null; go("home"); });
document.addEventListener("keydown", (e) => {
  if (view !== "study" || e.metaKey || e.ctrlKey) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); reveal(); }
  else if (e.key >= "1" && e.key <= "3") rate([0, 2, 4][+e.key - 1]);
  else if (e.key === "ArrowLeft") rate(0);
  else if (e.key === "ArrowRight") rate(2);
});

/* Swipe right = know, left = again; works on the question and on the answer. */
let swiped = false;
function attachSwipe(el) {
  let x0 = null, y0 = 0, dx = 0, pid = null, dragging = false;
  const stamp = $("s-stamp");
  const paint = () => {
    el.style.transform = dx ? "translateX(" + dx + "px) rotate(" + dx / 24 + "deg)" : "";
    stamp.className = "stamp " + (dx > 0 ? "know" : "again");
    stamp.textContent = dx > 0 ? "Знаю" : "Повторить";
    stamp.style.opacity = Math.min(1, Math.abs(dx) / 90);
  };
  el.addEventListener("pointerdown", (e) => {
    if (!S || e.target.closest(".speak, .pill")) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; pid = e.pointerId; dragging = false;
  });
  el.addEventListener("pointermove", (e) => {
    if (x0 === null || e.pointerId !== pid) return;
    dx = e.clientX - x0;
    if (!dragging) {
      if (Math.abs(dx) < 10) return;
      if (Math.abs(e.clientY - y0) > Math.abs(dx)) { x0 = null; return; }
      dragging = true;
      el.setPointerCapture(pid);
      el.classList.add("dragging");
    }
    paint();
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null;
    if (!dragging) return;
    dragging = false;
    el.classList.remove("dragging");
    swiped = true;
    setTimeout(() => { swiped = false; }, 60);
    if (Math.abs(dx) < 90) { dx = 0; paint(); return; }
    const r = dx > 0 ? 2 : 0;
    el.style.transform = "translateX(" + (dx > 0 ? 1 : -1) * window.innerWidth + "px) rotate(" + dx / 12 + "deg)";
    setTimeout(() => {
      el.classList.add("dragging");
      dx = 0; paint();
      setTimeout(() => el.classList.remove("dragging"), 30);
      if (!S) return;
      S.shown = true;
      rate(r);
    }, 160);
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}
attachSwipe($("s-front"));
attachSwipe($("s-back"));
document.addEventListener("gesturestart", (e) => e.preventDefault());
// A drag that starts on the tab bar must not pan the page on iOS.
$("tabbar").addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

/* ---------- Session summary ---------- */

function finish() {
  const s = S, g = s.g;
  const mins = Math.max(1, Math.round((Date.now() - s.start) / MIN));
  const againTotal = Object.values(s.again).reduce((a, b) => a + b, 0);
  const groupNow = groupDone(g);
  const course = courseOf(g), info = groupInfo(g);
  let wasCurrentAdvanced = false;
  if (s.kind === "group" && groupNow && P.pos[course] === g && nextOpenGroup(g) !== g) { P.pos[course] = nextOpenGroup(g); save(); wasCurrentAdvanced = true; }

  const words = groupWords(g), learned = groupLearnedCount(g);
  if (s.kind === "review") {
    $("d-title").textContent = "Готово";
    $("d-sub").textContent = "Повторение закончено.";
  } else if (groupNow) {
    $("d-title").textContent = "Bravo!";
    $("d-sub").textContent = cap(info.short) + " выучена." + (wasCurrentAdvanced ? " Дальше — " + groupInfo(P.pos[course]).short + "." : "");
  } else {
    $("d-title").textContent = s.kind === "practice" ? "Прогон закончен" : "Dobro!";
    $("d-sub").textContent = s.kind === "practice" ? "Расписание не менялось." : "На сегодня всё. Остальные слова вернутся завтра.";
  }

  $("d-group").hidden = s.kind === "review";
  $("d-group").innerHTML = '<div class="between"><span>' + esc(cap(info.short)) + '</span><b>' + learned + " / " + words.length + "</b></div>" +
    '<div class="bar"><span style="width:' + (learned / words.length * 100) + '%;background:var(--ink)"></span></div>';

  const stat = (v, l, accent) => '<div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:28px;font-weight:600' + (accent ? ";color:var(--accent)" : "") + '">' + v + '</div><div class="dim small">' + l + "</div></div>";
  $("d-stats").innerHTML = stat(s.done, "карточек") + stat(mins + " мин", "времени") +
    stat(s.kind === "review" ? reviewDue(Date.now()).length : learned + "/" + words.length, s.kind === "review" ? "осталось" : "в группе выучено") +
    stat(againTotal, "«повторить»", againTotal > 0);

  const missed = Object.entries(s.again).sort((a, b) => b[1] - a[1]).slice(0, 5);
  $("d-missed").hidden = !missed.length;
  $("d-missed").innerHTML = '<div class="dim" style="font-size:14px">Ошибался чаще всего</div>' +
    missed.map(([n]) => '<div class="between" style="font-size:16px"><span class="serif">' + esc(W[n - 1][0]) + '</span><span class="dim">' + esc(ruQuestion(W[n - 1][1])) + "</span></div>").join("");

  const main = $("d-main");
  main.hidden = false;
  if (s.kind === "review") main.hidden = true;
  else if (groupNow && wasCurrentAdvanced) { main.textContent = "Начать: " + groupInfo(P.pos[course]).short; main.dataset.act = "group"; }
  else if (groupNow) main.hidden = true;
  else { main.textContent = "Прогнать ещё раз"; main.dataset.act = "practice"; }
  S = null;
  go("done");
}
$("d-main").addEventListener("click", () => startSession($("d-main").dataset.act));
$("d-home").addEventListener("click", () => go("home"));

/* ---------- Groups ---------- */

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

function renderGroups() {
  const done = KEYS.f.filter(groupDone).length;
  $("g-total").textContent = done + " / " + GROUPS;
  let html = "";
  for (let g = 0; g < GROUPS; g++) {
    const key = "f:" + g, words = groupWords(key), learned = groupLearnedCount(key);
    const isDone = learned === words.length, cur = key === P.pos.f;
    const started = words.some((n) => card(n));
    const cls = cur ? "current" : isDone || started ? "" : "ahead";
    const badge = isDone ? '<span class="badge done">' + CHECK + "</span>" : '<span class="badge' + (cur ? " cur" : "") + '">' + (g + 1) + "</span>";
    html += '<button class="g ' + cls + '" data-key="' + key + '"><span class="row">' + badge +
      '<span class="two"><span style="font-size:16px;font-weight:' + (isDone || cur ? 600 : 400) + '">Группа ' + (g + 1) + (cur ? " · сейчас" : "") + '</span><span class="dim small">' + words[0] + "–" + words[words.length - 1] + " · " + esc(W[words[0] - 1][0]) + ", " + esc(W[words[1] - 1][0]) + "…</span></span>" +
      '<span style="font-size:14px;' + (cur ? "font-weight:600;color:var(--accent)" : "color:var(--fg-dim)") + '">' + learned + "/" + words.length + "</span></span>" +
      (cur ? '<span class="bar" style="width:100%;height:6px"><span style="width:' + (learned / words.length * 100) + '%;background:var(--accent)"></span></span>' : "") +
      "</button>";
  }
  $("g-list").innerHTML = html;
  const curEl = $("g-list").querySelector(".current");
  if (curEl) curEl.scrollIntoView({ block: "center" });
}

$("g-list").addEventListener("click", (e) => {
  const b = e.target.closest("[data-key]");
  if (b) selectGroup(b.dataset.key, () => go("home"));
});

// Makes key the current group of its course; jumping ahead of an unfinished group asks first.
function selectGroup(key, then) {
  const course = courseOf(key), cur = P.pos[course];
  const apply = () => { P.pos[course] = key; P.last = course; save(); then(); };
  if (key === cur || !isAhead(key, cur) || groupDone(cur)) { apply(); return; }
  const words = groupWords(cur), left = words.filter((n) => !isLearned(n));
  const from = groupInfo(cur), to = groupInfo(key);
  sheet({
    title: "Перейти: " + to.short + "?",
    text: esc(cap(from.short)) + " ещё не выучена: <b style=\"color:var(--accent)\">" + (words.length - left.length) + " из " + words.length + "</b>. Начатые слова никуда не денутся — они будут попадаться в «Повторить старые».",
    extra: '<div class="panel" style="padding:12px 16px;gap:8px"><div class="dim small">Ещё не выучены</div><div class="serif" style="font-size:15px;line-height:1.5">' + left.map((n) => esc(W[n - 1][0])).join(", ") + "</div></div>",
    ok: "Доучить: " + from.short,
    alt: "Всё равно перейти",
    onOk: () => { P.last = course; save(); go("home"); },
    onAlt: apply,
  });
}

function renderThemes() {
  const done = T.filter((_, i) => themeDone(i)).length;
  $("t-total").textContent = done + " / " + T.length;
  const curTheme = parseKey(P.pos.t)[1];
  let html = "", block = "";
  T.forEach(([, title, blk, words], i) => {
    if (blk !== block) { block = blk; html += '<div class="block-title">' + esc(blk) + "</div>"; }
    const learned = words.filter(isLearned).length, isDone = learned === words.length, cur = i === curTheme;
    const fresh = words.filter((n) => n > FREQ).length, groups = THEME_GROUPS[i].length;
    const started = words.some((n) => card(n));
    const cls = cur ? "current" : isDone || started ? "" : "ahead";
    const badge = isDone ? '<span class="badge done">' + CHECK + "</span>" : "";
    html += '<button class="g ' + cls + '" data-theme="' + i + '"><span class="row">' + badge +
      '<span class="two"><span style="font-size:16px;font-weight:' + (isDone || cur ? 600 : 400) + '">' + esc(title) + (cur ? " · сейчас" : "") + '</span><span class="dim small">' +
      words.length + " " + plural(words.length, "слово", "слова", "слов") + " · " + fresh + " " + plural(fresh, "новое", "новых", "новых") + " · " + groups + " " + plural(groups, "группа", "группы", "групп") + "</span></span>" +
      '<span style="font-size:14px;' + (cur ? "font-weight:600;color:var(--accent)" : "color:var(--fg-dim)") + '">' + learned + "/" + words.length + "</span></span>" +
      (isDone ? "" : '<span class="bar" style="width:100%;height:6px"><span style="width:' + (learned / words.length * 100) + "%;background:" + (cur ? "var(--accent)" : "var(--ink)") + '"></span></span>') +
      "</button>";
  });
  $("t-list").innerHTML = html;
  const curEl = $("t-list").querySelector(".current");
  if (curEl) curEl.scrollIntoView({ block: "center" });
}

let openTheme = 0;
$("t-list").addEventListener("click", (e) => {
  const b = e.target.closest("[data-theme]");
  if (b) { openTheme = +b.dataset.theme; go("theme"); }
});

function renderTheme() {
  const i = openTheme, [, title, blk, words] = T[i];
  const fresh = words.filter((n) => n > FREQ).length;
  $("th-title").textContent = title;
  $("th-sub").textContent = "По темам › " + blk + " · " + words.length + " " + plural(words.length, "слово", "слова", "слов") + " · " + fresh + " " + plural(fresh, "новое", "новых", "новых");
  let html = "";
  THEME_GROUPS[i].forEach((gw, g) => {
    const key = "t:" + i + ":" + g, learned = groupLearnedCount(key), cur = key === P.pos.t;
    const isDone = learned === gw.length, started = gw.some((n) => card(n));
    const cls = cur ? "current" : isDone || started ? "" : "ahead";
    html += '<div class="g ' + cls + '" data-key="' + key + '" role="button" tabindex="0">' +
      '<span class="between" style="width:100%"><span style="font-size:16px;font-weight:' + (cur || isDone ? 600 : 400) + '">' + "Группа " + (g + 1) + (cur ? " · сейчас" : isDone ? " · выучена" : "") + '</span><span style="font-size:14px;' + (cur ? "font-weight:600;color:var(--accent)" : "color:var(--fg-dim)") + '">' + learned + "/" + gw.length + "</span></span>" +
      '<span class="words">' + gw.map((n) => '<span class="' + (isLearned(n) ? "learned" : isLearning(n) ? "learning" : "") + '">' + esc(W[n - 1][0]) + "</span>").join(" · ") + "</span>" +
      (cur ? '<span class="legend"><span><i style="background:var(--fg)"></i>выучено</span><span><i style="background:var(--accent)"></i>учу</span><span><i style="background:var(--fg-dim)"></i>новое</span></span><button class="btn primary" data-learn="' + key + '">Учить группу ' + (g + 1) + "</button>" : "") +
      "</div>";
  });
  $("th-list").innerHTML = html;
}

$("th-list").addEventListener("click", (e) => {
  if (e.target.closest("[data-learn]")) { P.last = "t"; save(); startSession("group"); return; }
  const b = e.target.closest("[data-key]");
  if (b && b.dataset.key !== P.pos.t) selectGroup(b.dataset.key, () => renderTheme());
});

/* ---------- Dictionary ---------- */

const FILTERS = [["all", "Все"], ["learning", "Учу"], ["learned", "Выучено"], ["hard", "Сложные"]];
let filter = "all", shownCount = 0, results = [];
const fold = (s) => s.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/đ/g, "dj").replace(/ё/g, "е");
const FOLDED = W.map((w) => (w ? fold(w[0] + " " + w[1]) : ""));
const isHard = (n) => { const c = card(n); return !!c && c.l >= 2; };

function renderDict(reset) {
  const q = fold($("q").value.trim());
  const counts = { all: W.filter(Boolean).length, learning: 0, learned: 0, hard: 0 };
  for (const k in P.cards) { const n = +k; if (isLearned(n)) counts.learned++; else counts.learning++; if (isHard(n)) counts.hard++; }
  $("chips").innerHTML = FILTERS.map(([id, label]) => '<button class="chip" data-f="' + id + '" aria-pressed="' + (filter === id) + '">' + label + " " + counts[id] + "</button>").join("");
  if (reset) {
    results = [];
    for (let n = 1; n <= N; n++) {
      if (filter === "learning" && !isLearning(n)) continue;
      if (filter === "learned" && !isLearned(n)) continue;
      if (filter === "hard" && !isHard(n)) continue;
      if (!W[n - 1]) continue;
      if (q && !FOLDED[n - 1].includes(q)) continue;
      results.push(n);
    }
    shownCount = 0;
    $("d-list").innerHTML = "";
  }
  const slice = results.slice(shownCount, shownCount + 100);
  shownCount += slice.length;
  $("d-list").insertAdjacentHTML("beforeend", slice.map((n) =>
    '<button data-n="' + n + '"><span class="num">' + n + '</span><span class="two"><span class="s">' + esc(W[n - 1][0]) + '</span><span class="t">' + esc(W[n - 1][1]) + '</span></span><span class="dot ' + (isLearned(n) ? "learned" : isLearning(n) ? "learning" : "") + '"></span></button>').join(""));
  $("d-list").hidden = !results.length;
  $("d-more").hidden = shownCount >= results.length;
}
$("q").addEventListener("input", () => renderDict(true));
$("chips").addEventListener("click", (e) => { const b = e.target.closest("[data-f]"); if (b) { filter = b.dataset.f; renderDict(true); } });
$("d-more").addEventListener("click", () => renderDict(false));
$("d-list").addEventListener("click", (e) => { const b = e.target.closest("[data-n]"); if (b) openWord(+b.dataset.n); });

function openWord(n) {
  const scroll = $("dict").scrollTop;
  $("w-title").textContent = "№" + n;
  $("w-card").innerHTML = backHtml(n, true);
  const c = card(n);
  let status;
  if (!c) status = "Ещё не встречалось.";
  else {
    const learned = isLearned(n);
    const when = c.due <= Date.now() ? "уже пора" : c.i === 0 ? "сегодня" : new Date(c.due).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
    status = (learned ? "Выучено" : "Учу: вспомнил " + c.d.length + " из " + P.set.need) + " · следующий показ: " + when + (c.l ? " · забывал " + c.l + " " + plural(c.l, "раз", "раза", "раз") : "");
  }
  const where = (n <= FREQ ? ["Частотный, группа " + (Math.floor((n - 1) / GROUP) + 1)] : []).concat((THEMES_OF[n] || []).map((i) => "тема «" + T[i][1] + "»"));
  $("w-status").innerHTML = '<div class="dim">' + status + '</div><div class="small dim">' + esc(where.join(" · ")) + "</div>";
  $("w-back").onclick = () => { $("word").hidden = true; $("dict").hidden = false; view = "dict"; $("dict").scrollTop = scroll; };
  for (const id of VIEWS) $(id).hidden = id !== "word";
  view = "word";
  syncTabs("word");
  $("word").scrollTop = 0;
}

document.addEventListener("click", (e) => { const b = e.target.closest("[data-say]"); if (b) speak(W[+b.dataset.say - 1][0]); });

/* ---------- Speech ---------- */

// Drops stress marks but keeps č, ć, š, ž: in NFD those are a caron or acute right after c, s or z.
function unstressed(s) {
  return s.normalize("NFD").replace(/(^|[^cszCSZ])\p{M}+/gu, "$1").normalize("NFC");
}

let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find((v) => /^sr/i.test(v.lang)) || vs.find((v) => /^(hr|bs)/i.test(v.lang)) || null;
}
const canSpeak = () => "speechSynthesis" in window;
if (canSpeak()) { pickVoice(); speechSynthesis.addEventListener("voiceschanged", pickVoice); }
function speak(text) {
  if (!canSpeak()) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(unstressed(text));
  u.lang = voice ? voice.lang : "sr-RS";
  if (voice) u.voice = voice;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

/* ---------- Settings ---------- */

function renderSettings() {
  $("need").textContent = P.set.need;
  $("dir").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.dir === P.set.dir));
  $("speak").setAttribute("aria-checked", P.set.speak);
  const seen = Object.keys(P.cards).length;
  $("set-foot").textContent = "Словарь: " + N + " слов · встречалось " + seen + " · работает без интернета";
}
$("need-minus").addEventListener("click", () => { P.set.need = Math.max(1, P.set.need - 1); save(); renderSettings(); });
$("need-plus").addEventListener("click", () => { P.set.need = Math.min(5, P.set.need + 1); save(); renderSettings(); });
$("dir").addEventListener("click", (e) => { const b = e.target.closest("[data-dir]"); if (b) { P.set.dir = b.dataset.dir; save(); renderSettings(); } });
$("speak").addEventListener("click", () => { P.set.speak = !P.set.speak; save(); renderSettings(); });

$("export").addEventListener("click", async () => {
  const name = "srpske-reci-" + dayKey(Date.now()) + ".json";
  const blob = new Blob([JSON.stringify(P)], { type: "application/json" });
  const file = new File([blob], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});
$("import").addEventListener("click", () => $("import-file").click());
$("import-file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  try {
    const p = JSON.parse(await f.text());
    if (!p || p.v !== 1 || typeof p.cards !== "object") throw new Error("format");
    const count = Object.keys(p.cards).length;
    sheet({
      title: "Загрузить прогресс?",
      text: "В файле " + count + " " + plural(count, "слово", "слова", "слов") + ". Текущий прогресс на телефоне заменится.",
      ok: "Загрузить", alt: "Отмена",
      onOk: () => { P = upgrade(p); save(); toast("Прогресс загружен"); go("home"); },
    });
  } catch (err) { toast("Это не файл прогресса"); }
});
$("reset").addEventListener("click", () => sheet({
  title: "Начать заново?",
  text: "Весь прогресс на этом телефоне сотрётся. Если нужна копия — сначала сохраните её в файл.",
  ok: "Оставить как есть", alt: "Стереть прогресс",
  onAlt: () => { P = blank(); save(); toast("Прогресс стёрт"); go("home"); },
}));

/* ---------- Sheet and toast ---------- */

function sheet(o) {
  $("sheet-title").textContent = o.title;
  $("sheet-text").innerHTML = o.text;
  $("sheet-extra").innerHTML = o.extra || "";
  $("sheet-ok").textContent = o.ok;
  $("sheet-alt").textContent = o.alt;
  const close = () => { $("sheet").hidden = true; };
  $("sheet-ok").onclick = () => { close(); o.onOk && o.onOk(); };
  $("sheet-alt").onclick = () => { close(); o.onAlt && o.onAlt(); };
  $("sheet").onclick = (e) => { if (e.target === $("sheet")) close(); };
  $("sheet").hidden = false;
}
let toastTimer;
function toast(t) {
  $("toast").textContent = t;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; }, 2500);
}

/* ---------- Start ---------- */

/* iOS resumes a home-screen app instead of relaunching it, so updates are checked on
   every return to the foreground; a new worker takes over and the page reloads once
   the user is not in the middle of a session. */
let swReg = null, reloadPending = false;
function reloadIfIdle() { if (reloadPending && view !== "study") location.reload(); }
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (swReg) swReg.update().catch(() => {});
  if (view === "home") renderHome();
});
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => { swReg = r; }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) return;
    reloadPending = true;
    reloadIfIdle();
  });
}
go("home");
</script>
